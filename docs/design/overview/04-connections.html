<title>Overview – Connections (reference sketch)</title>
<style>
  :root { --bg: #F3F1EC; --surface: #FFFFFF; --text: #1B1D20; --muted: #5A5F66; --line: #DAD6CE;
          --orange: #B35712; --blue: #245A8C; --seg: #E6E1D8; --mono: "IBM Plex Mono", Consolas, monospace; }
  * { box-sizing: border-box; }
  body { margin: 0; width: 390px; height: 844px; background: var(--bg); color: var(--text); position: relative;
         font: 14px/1.35 "IBM Plex Sans", "Segoe UI", system-ui, sans-serif; overflow: hidden; }
  .top { padding: 18px 16px 0; position: relative; }
  .date { font-family: var(--mono); color: var(--muted); font-size: 13px; letter-spacing: .02em; }
  h1 { margin: 2px 0 0; font-size: 28px; }
  .filter { position: absolute; right: 16px; top: 32px; width: 44px; height: 44px; border-radius: 50%;
            border: 1px solid var(--line); background: var(--surface); display: grid; place-items: center; font-size: 18px; }
  .segs { margin: 16px 16px 12px; background: var(--seg); border-radius: 12px; display: flex; padding: 4px; }
  .segs span { flex: 1; text-align: center; padding: 10px 0; font-size: 13px; border-radius: 9px; }
  .segs .on { background: #1B1D20; color: #fff; }
  .card { margin: 0 16px 12px; background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 16px 12px 12px; }
  .fh { display: flex; align-items: center; padding: 0 4px; }
  .fh div { flex: 1; } .fh small { color: var(--muted); font-size: 12px; } .fh b { display: block; font-size: 15px; }
  .fh .w { border: 1px solid var(--line); border-radius: 20px; padding: 8px 14px; color: var(--blue); font-weight: 600; font-size: 13px; }
  .steps { display: flex; background: var(--seg); border-radius: 12px; padding: 4px; margin: 10px 0 4px; }
  .steps span { flex: 1; text-align: center; padding: 8px 0; border-radius: 9px; font-size: 13px; font-weight: 600; }
  .steps .on { background: var(--surface); }
  svg { display: block; }
  svg text { font-family: "IBM Plex Sans", "Segoe UI", sans-serif; }
  .legend { display: flex; gap: 16px; font-size: 11px; color: var(--muted); padding: 2px 4px 0; align-items: center; }
  .legend i { display: inline-block; width: 18px; border-top: 2px solid #A9BBD0; margin-right: 5px; vertical-align: 3px; }
  .legend i.dash { border-top: 2px dashed #C9C4BA; }
  .hint { color: var(--muted); font-size: 12px; padding: 0 20px; }
  .nav { position: absolute; bottom: 0; left: 0; right: 0; height: 70px; border-top: 1px solid var(--line); background: var(--bg);
         display: flex; justify-content: space-around; align-items: center; font-size: 10px; color: var(--muted); }
  .nav div { text-align: center; width: 70px; }
  .nav .i { display: block; font-size: 17px; margin: 0 auto 2px; width: 50px; border-radius: 12px; padding: 2px 0; }
  .nav .on { color: var(--blue); font-weight: 600; }
  .nav .on .i { background: #DCE6F0; }
</style>
</head>
